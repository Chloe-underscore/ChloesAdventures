<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Mijn tekeningen</title>
    <link rel="stylesheet" href="./css/normal.css" />

  <body>
    <a href="index.html"> Home </a>

    <div id="container">
      <div id="gallery">

          <img

        <figure class="gallery__item gallery__item--2">

            alt="Image 2"
          />

          <img
            src="digital_fotos/portret_schets_child_oefening_lineart.png"

            alt="Image 3"
          />
        </figure>

        <figure class="gallery__item gallery__item--4">
          <img
            src="digital_fotos/Zonder titel136 (1).png"
            class="gallery__img"
            alt="Amety, en Luz vecht dansen onder de maan"
          />
        </figure>

        <figure class="gallery__item gallery__item--5">
          <img
            src="digital_fotos/tired witch.png"
            class="gallery__img"
            alt="Image 5"
          />
        </figure>

        <figure class="gallery__item gallery__item--6">

          />
